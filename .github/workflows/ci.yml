name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: gitleaks (full history)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --config /repo/.gitleaks.toml /repo
  core:
    strategy:
      matrix: { runner: [ubuntu-24.04, ubuntu-24.04-arm] }
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read }
    defaults: { run: { working-directory: rsolv_core } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with: { otp-version: "29.0.4", elixir-version: "1.20.2", version-type: strict }
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test --warnings-as-errors
  host:
    strategy:
      matrix: { runner: [ubuntu-24.04, ubuntu-24.04-arm] }
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read }
    defaults: { run: { working-directory: rsolv_host } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with: { otp-version: "29.0.4", elixir-version: "1.20.2", version-type: strict }
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test --warnings-as-errors --include docker
  package:
    # Builds the glibc ERTS and the Burrito binary natively on each architecture,
    # smoke-tests the real binary, and keeps it as a CI artifact. No release here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions: { contents: read }
    defaults: { run: { working-directory: rsolv_host } }
    env:
      ARCH: ${{ matrix.arch }}
      BURRITO_TARGET: linux_${{ matrix.arch }}
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install Zig 0.16.0 (pinned tarball, SHA-256 checked)
        run: |
          scripts/install-zig.sh "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >>"$GITHUB_PATH"
      - name: Build the glibc ERTS from pinned sources
        run: |
          start=$(date +%s)
          scripts/build-erts.sh "$ARCH" erts
          echo "ERTS build: $(( $(date +%s) - start )) s"
      - name: Install OTP (the ERTS tarball, checked against erts.lock), Elixir, Hex and rebar3 (SHA-256 checked)
        run: |
          tc="$RUNNER_TEMP/toolchain"
          scripts/install-toolchain.sh erts "$tc"
          { echo "$tc/otp/bin"; echo "$tc/elixir/bin"; } >>"$GITHUB_PATH"
          echo "MIX_HOME=$tc/mix" >>"$GITHUB_ENV"
      - name: Build the binary (verify_erts checks the ERTS against erts.lock)
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          echo "erl: $(command -v erl), elixir: $(command -v elixir), mix: $(command -v mix)"
          start=$(date +%s)
          mix deps.get --check-locked
          mix release
          echo "binary build: $(( $(date +%s) - start )) s"
          downloads=$(find "$XDG_CACHE_HOME" -path '*burrito*' -type f | wc -l)
          echo "files in Burrito's download cache: $downloads"
          test "$downloads" -eq 0
      - name: Smoke-test the real binary
        run: scripts/smoke.sh "burrito_out/rsolv_host_linux_$ARCH" --online
      - name: Record the artifact's digest
        run: |
          cd burrito_out
          sha256sum "rsolv_host_linux_$ARCH" | tee "rsolv_host_linux_$ARCH.sha256"
          sha256sum ../erts/"linux_$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rsolv_host_linux_${{ matrix.arch }}
          path: |
            rsolv_host/burrito_out/rsolv_host_linux_${{ matrix.arch }}
            rsolv_host/burrito_out/rsolv_host_linux_${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 14
  ci-success:
    name: CI Success
    if: always()
    needs: [gitleaks, core, host, package]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every job succeeded
        env: { RESULTS: "${{ join(needs.*.result, ' ') }}" }
        run: test -z "$(printf '%s' "$RESULTS" | tr ' ' '\n' | grep -vx success)"
