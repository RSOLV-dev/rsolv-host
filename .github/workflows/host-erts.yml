# Releases the self-built glibc ERTS (ADR-077 amendment). See docs/RELEASE-RUNBOOK.md.
#   build:   natively per architecture, read-only; the tarball must match erts.lock.
#   attest:  build provenance for both tarballs (no repository code runs here).
#   publish: tags only, behind the `release` environment; draft, attach, publish.
# A pull request that touches the ERTS inputs runs build and attest as a dry run.
name: host-erts
on:
  push:
    tags: ["erts-otp-*"]
  pull_request:
    paths:
      - .github/workflows/host-erts.yml
      - rsolv_host/erts.lock
      - rsolv_host/scripts/build-erts.sh
      - rsolv_host/scripts/build-erts-inside.sh
      - rsolv_host/scripts/erts-inputs.env
permissions: {}
# A tag runs once; a pull request's newer push replaces its older dry run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run: { shell: bash }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions: { contents: read }
    env: { ARCH: "${{ matrix.arch }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: The tag names the locked OTP, and its commit is a first-parent commit of main
        if: github.event_name == 'push'
        run: |
          # A first-parent commit of main: a merge (or direct) commit main itself passed through,
          # never a commit from inside a merged branch. fetch-depth: 0 gives all of main. Not
          # grep -q: it exits at the match and, under pipefail, git's SIGPIPE fails the check.
          git rev-list --first-parent origin/main | grep -xF "$GITHUB_SHA" >/dev/null ||
            { echo "::error::$GITHUB_SHA is not a first-parent commit of main"; exit 1; }
          source rsolv_host/scripts/erts-inputs.env
          otp=$(jq -er .otp rsolv_host/erts.lock)
          test "$otp" = "$OTP_VERSION"
          test "$GITHUB_REF_NAME" = "erts-otp-$otp"
      - name: Build the ERTS natively from pinned sources
        run: rsolv_host/scripts/build-erts.sh "$ARCH" dist
      - name: The tarball matches erts.lock
        working-directory: dist
        run: |
          want=$(jq -er --arg t "linux_$ARCH" '.targets[$t].sha256' ../rsolv_host/erts.lock)
          echo "$want  linux_$ARCH.tar.gz" | tee "linux_$ARCH.tar.gz.sha256" | sha256sum -c -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: erts-linux_${{ matrix.arch }}
          path: |
            dist/linux_${{ matrix.arch }}.tar.gz
            dist/linux_${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
  attest:
    needs: build
    # Fork pull requests get no OIDC token, so they stop after build.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { id-token: write, attestations: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "erts-linux_*", merge-multiple: true, path: dist }
      - name: Checksums still match
        working-directory: dist
        run: |
          sha256sum -c ./*.sha256
          cat ./*.sha256 >SHA256SUMS && rm ./*.sha256
          tee -a "$GITHUB_STEP_SUMMARY" <SHA256SUMS
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-checksums: dist/SHA256SUMS }
      - name: The attestation verifies with the runbook's flags
        env: { GH_TOKEN: "${{ github.token }}", BUNDLE: "${{ steps.attest.outputs.bundle-path }}" }
        run: |
          cp "$BUNDLE" dist/provenance.sigstore.jsonl
          printf '%s\n' 2.102.0 "$(gh --version | awk 'NR==1{print $3}')" | sort -V -C
          for f in dist/linux_*.tar.gz; do
            gh attestation verify "$f" --bundle dist/provenance.sigstore.jsonl --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/host-erts.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: release, path: dist/, if-no-files-found: error, retention-days: 30 }
  publish:
    needs: attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/erts-otp-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release, path: dist }
      - name: Re-verify the attestation, then draft, attach, publish (immutable release)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          printf '%s\n' 2.102.0 "$(gh --version | awk 'NR==1{print $3}')" | sort -V -C
          for f in dist/linux_*.tar.gz; do
            gh attestation verify "$f" --bundle dist/provenance.sigstore.jsonl --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/host-erts.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          tag=$GITHUB_REF_NAME
          {
            echo "Self-built glibc ERTS for OTP ${tag#erts-otp-}, built natively on GitHub-hosted runners by \`host-erts.yml\` at $GITHUB_SHA."
            echo "Inputs: \`rsolv_host/scripts/erts-inputs.env\` at that commit. Each tarball matches \`rsolv_host/erts.lock\`."
            echo; echo '```'; cat dist/SHA256SUMS; echo '```'; echo
            echo "Verify:"; echo; echo '```'
            echo "gh attestation verify linux_x86_64.tar.gz --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/host-erts.yml \\"
            echo "  --source-ref refs/tags/$tag --source-digest $GITHUB_SHA --deny-self-hosted-runners"
            echo '```'
          } >notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "ERTS ${tag#erts-otp-} (glibc, host client)" --notes-file notes.md
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" dist/linux_*.tar.gz dist/SHA256SUMS dist/provenance.sigstore.jsonl
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
